# Review the paid plans in Render before applying this Blueprint.
databases:
  - name: binderclip-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: '17'
    databaseName: binderclip
    user: binderclip
    ipAllowList: []

services:
  - type: web
    name: binderclip
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: bash scripts/render-build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py provision_admin --disable-demo
    startCommand: python -m gunicorn binderclip.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: 'false'
      - key: DEMO_LOGIN
        value: 'false'
      - key: TRUST_PROXY
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: binderclip-db
          property: connectionString
      - key: INITIAL_ADMIN_EMAIL
        value: inventory.choco@gmail.com
      - key: INITIAL_ADMIN_NAME
        value: Admin1
      - key: INITIAL_ADMIN_USERNAME
        value: Admin1
      - key: INITIAL_COMPANY_NAME
        value: Binderclip
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
